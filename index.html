<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>富士ストライク</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#0a0418;overflow:hidden;font-family:sans-serif;color:#fff;user-select:none;touch-action:manipulation}
#c{display:block;width:100vw;height:100vh;touch-action:none}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;font-size:14px;font-weight:bold;pointer-events:none;z-index:5}
#hud div{background:rgba(0,0,0,.7);padding:6px 12px;border-radius:10px;border:2px solid #d4a017;color:#ffe0f0}
#btns{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;z-index:10}
.grp{display:flex;gap:12px}
.b{width:64px;height:64px;border-radius:50%;background:rgba(212,160,23,.85);border:3px solid #ffd966;color:#fff;font-size:26px;font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;touch-action:none}
.b:active{transform:scale(.9);background:#ff9e20}
#atk{background:rgba(255,107,158,.9);border-color:#ff9ec7}
#start{position:fixed;inset:0;background:rgba(5,2,10,.98);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;text-align:center;padding:20px}
h1{color:#d4a017;font-size:30px;margin-bottom:12px;text-shadow:0 0 20px #d4a017}
p{font-size:14px;color:#ffe0f0;margin-bottom:20px;line-height:1.7}
#go{background:linear-gradient(#d4a017,#a06010);color:#fff;border:2px solid #ffd966;border-radius:26px;padding:16px 40px;font-size:18px;font-weight:bold;cursor:pointer;box-shadow:0 5px 0 #604010}
#go:active{transform:translateY(3px);box-shadow:0 2px 0 #604010}
#toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.9);border:2px solid #ffd966;border-radius:12px;padding:10px 20px;font-size:14px;color:#ffd966;font-weight:bold;z-index:50;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
<div>❤ <span id="hp">100</span></div>
<div>⚔ <span id="kl">0</span>/10</div>
</div>
<div id="btns">
<div class="grp">
<div class="b" id="left">◀</div>
<div class="b" id="right">▶</div>
</div>
<div class="grp">
<div class="b" id="atk">⚔</div>
</div>
</div>
<div id="start">
<h1>富士ストライク</h1>
<p>曜日の鬼を倒せ！<br>◀ ▶ で移動、⚔ で攻撃<br>10体倒せば勝利</p>
<button id="go">▶ 開始</button>
</div>
<div id="toast"></div>
<script>
var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');
var W,H,GY;
var hp=100,kills=0,enemies=[],parts=[],spawnT=30,tick=0,facing=1;
var px={x:200},keys={l:false,r:false};
var playing=false,over=false;

function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  W=canvas.width;H=canvas.height;GY=H-100;
}
window.addEventListener('resize',resize);
resize();

function showToast(m){
  var t=document.getElementById('toast');
  t.textContent=m;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},1500);
}

function updHUD(){
  document.getElementById('hp').textContent=Math.max(0,Math.round(hp));
  document.getElementById('kl').textContent=kills;
}

function reset(){
  hp=100;kills=0;enemies=[];parts=[];spawnT=30;px.x=W/2-25;over=false;
  updHUD();
}

function spawn(){
  var side=Math.random()<0.5?-1:1;
  var hpMax=30+kills*3;
  enemies.push({
    x:side===1?W+30:-60,
    vx:side*-1.3,
    hp:hpMax,mhp:hpMax,
    dmg:8,at:0,hf:0,bp:Math.random()*6
  });
}

function attack(){
  if(!playing)return;
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];
    if(e.dead)continue;
    var dist=Math.abs(e.x+22-(px.x+25));
    if(dist<100){
      e.hp-=25+Math.random()*10;
      e.hf=8;
      for(var j=0;j<8;j++){
        parts.push({x:e.x+22,y:GY-30,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8-2,life:30,c:'#ff6ba6'});
      }
      if(e.hp<=0){
        e.dead=true;kills++;
        showToast('倒した！');
        updHUD();
      }
    }
  }
}

function draw(){
  tick++;
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1a0a2e');
  g.addColorStop(0.6,'#3a1a5e');
  g.addColorStop(1,'#6a2a5e');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(W-100,100,40,0,7);ctx.fill();
  ctx.fillStyle='#1a0a2e';
  ctx.beginPath();ctx.arc(W-112,88,36,0,7);ctx.fill();
  var m=ctx.createLinearGradient(0,100,0,GY);
  m.addColorStop(0,'#9a7ac0');
  m.addColorStop(1,'#2a1a4e');
  ctx.fillStyle=m;
  ctx.beginPath();
  ctx.moveTo(0,GY);
  ctx.lineTo(W/2-100,140);
  ctx.lineTo(W/2,90);
  ctx.lineTo(W/2+100,140);
  ctx.lineTo(W,GY);
  ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.moveTo(W/2-70,170);
  ctx.lineTo(W/2,90);
  ctx.lineTo(W/2+70,170);
  ctx.lineTo(W/2+45,190);
  ctx.quadraticCurveTo(W/2,170,W/2-45,190);
  ctx.fill();
  ctx.fillStyle='#1a0a2a';
  ctx.fillRect(0,GY,W,H-GY);
  ctx.fillStyle='#3a2a5a';
  ctx.fillRect(0,GY,W,4);
  var bob=Math.sin(tick*0.1)*2;
  var cx=px.x+25,by=GY-75+bob;
  ctx.fillStyle='rgba(0,0,0,.4)';
  ctx.beginPath();ctx.ellipse(cx,GY+5,26,7,0,0,7);ctx.fill();
  ctx.fillStyle='#2c4a80';
  ctx.fillRect(cx-18,by+50,36,22);
  ctx.fillStyle='#d4a017';
  ctx.fillRect(cx-20,by+58,40,6);
  ctx.fillStyle='#ffdcc0';
  ctx.beginPath();ctx.arc(cx,by+22,24,0,7);ctx.fill();
  ctx.fillStyle='#0a0a1a';
  ctx.beginPath();ctx.arc(cx,by+18,24,Math.PI,0);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(cx-9,by+26,6,0,7);ctx.arc(cx+9,by+26,6,0,7);ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath();ctx.arc(cx-9+facing,by+26,3,0,7);ctx.arc(cx+9+facing,by+26,3,0,7);ctx.fill();
  ctx.fillStyle='#c0c0d0';
  ctx.fillRect(cx+(facing===1?20:-25),by+40,5*facing,40);
  ctx.fillStyle='#d4a017';
  ctx.fillRect(cx+(facing===1?15:-20),by+35,10,8);
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];
    if(e.dead)continue;
    var eb=Math.sin(tick*0.12+e.bp)*4;
    var ec=e.x+22,ey=GY-30+eb;
    ctx.fillStyle='rgba(0,0,0,.4)';
    ctx.beginPath();ctx.ellipse(ec,GY+5,22,6,0,0,7);ctx.fill();
    ctx.fillStyle=e.hf>0?'#fff':'#c0392b';
    ctx.beginPath();ctx.arc(ec,ey,26,0,7);ctx.fill();
    ctx.fillStyle=e.hf>0?'#fff':'#e67e22';
    ctx.beginPath();ctx.ellipse(ec,ey+10,18,10,0,0,7);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.moveTo(ec-12,ey-18);ctx.lineTo(ec-18,ey-32);ctx.lineTo(ec-5,ey-20);ctx.fill();
    ctx.beginPath();
    ctx.moveTo(ec+12,ey-18);ctx.lineTo(ec+18,ey-32);ctx.lineTo(ec+5,ey-20);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(ec-8,ey-4,6,0,7);ctx.arc(ec+8,ey-4,6,0,7);ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(ec-8,ey-4,3.5,0,7);ctx.arc(ec+8,ey-4,3.5,0,7);ctx.fill();
    ctx.fillStyle='#000';
    ctx.fillRect(ec-20,ey-45,40,5);
    ctx.fillStyle='#ff4a4a';
    ctx.fillRect(ec-20,ey-45,40*(e.hp/e.mhp),5);
  }
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.3;p.life--;
    ctx.globalAlpha=p.life/30;
    ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function update(){
  if(!playing||over)return;
  if(keys.l){px.x-=5;facing=-1;}
  if(keys.r){px.x+=5;facing=1;}
  px.x=Math.max(0,Math.min(W-50,px.x));
  spawnT--;
  if(spawnT<=0&&kills<10&&enemies.length<3){
    spawn();
    spawnT=70;
  }
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];
    if(e.dead)continue;
    e.x+=e.vx;
    if(e.hf>0)e.hf--;
    if(Math.abs(e.x+22-(px.x+25))<50&&e.at<=0){
      e.at=60;
      hp-=e.dmg;
      updHUD();
      if(hp<=0){
        hp=0;over=true;playing=false;
        showToast('敗北…');
      }
    }
    if(e.at>0)e.at--;
  }
  enemies=enemies.filter(function(e){return !e.dead&&e.x>-100&&e.x<W+100;});
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.3;p.life--;
  }
  parts=parts.filter(function(p){return p.life>0;});
  if(kills>=10&&!over){
    over=true;playing=false;
    showToast('🌸 勝利！ 🌸');
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

document.getElementById('go').addEventListener('click',function(){
  document.getElementById('start').style.display='none';
  resize();
  reset();
  playing=true;
});

function bindHold(id,key){
  var el=document.getElementById(id);
  var start=function(e){e.preventDefault();keys[key]=true;};
  var end=function(e){e.preventDefault();keys[key]=false;};
  el.addEventListener('touchstart',start);
  el.addEventListener('touchend',end);
  el.addEventListener('touchcancel',end);
  el.addEventListener('mousedown',start);
  el.addEventListener('mouseup',end);
  el.addEventListener('mouseleave',end);
}
bindHold('left','l');
bindHold('right','r');

document.getElementById('atk').addEventListener('click',attack);
document.getElementById('atk').addEventListener('touchstart',function(e){e.preventDefault();attack();});

document.addEventListener('keydown',function(e){
  if(e.code==='ArrowLeft')keys.l=true;
  if(e.code==='ArrowRight')keys.r=true;
  if(e.code==='Space'){e.preventDefault();attack();}
});
document.addEventListener('keyup',function(e){
  if(e.code==='ArrowLeft')keys.l=false;
  if(e.code==='ArrowRight')keys.r=false;
});

loop();
</script>
</body>
</html>
