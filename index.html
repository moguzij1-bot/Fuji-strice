<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>富士撃 — 七つの巻物</title>
<style>
  body {
    background: #1a1a2e url('IMG_1571.jpeg') no-repeat center center fixed;
    background-size: cover;
    color: #eee;
    font-family: 'Yu Mincho', 'Georgia', serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 15px;
    text-align: center;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10, 10, 25, 0.65);
    z-index: -1;
  }
  h1 { color: #ffb7c5; font-size: 28px; margin-bottom: 4px; text-shadow: 2px 2px 4px #000; }
  .subtitle { color: #ddd; font-size: 14px; margin-bottom: 10px; text-shadow: 1px 1px 3px #000; }
  #langBar {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-bottom: 10px;
  }
  .langBtn {
    background: rgba(51,51,51,0.85);
    color: #ccc;
    border: 1px solid #666;
    padding: 6px 14px;
    font-size: 14px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }
  .langBtn.active { background: #ffb7c5; color: #1a1a2e; border-color: #fff; }
  #demon { font-size: 64px; margin: 20px 0; transition: opacity 0.5s; }
  #demonName { font-size: 18px; color: #ffb7c5; margin-bottom: 10px; min-height: 24px; text-shadow: 2px 2px 4px #000; }
  #seals {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 20px 0;
  }
  .seal {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 3px solid #888;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    transition: all 0.3s;
    background: rgba(0,0,0,0.4);
  }
  .seal.active { background: #ff4444; border-color: #ff8888; }
  .seal.broken { background: rgba(50,50,50,0.6); border-color: #555; color: #555; }
  button {
    background: #ffb7c5;
    border: none;
    padding: 12px 24px;
    font-size: 17px;
    border-radius: 8px;
    cursor: pointer;
    margin: 5px;
    font-family: inherit;
  }
  button:disabled { background: #555; cursor: not-allowed; }
  #log {
    background: rgba(15, 15, 26, 0.85);
    padding: 15px;
    border-radius: 8px;
    margin: 20px 0;
    min-height: 70px;
    text-align: left;
    font-size: 15px;
    line-height: 1.6;
  }
  #scroll {
    background: #f5e6c8;
    color: #2a1a0a;
    padding: 30px;
    border-radius: 5px;
    margin: 20px 0;
    font-style: italic;
    display: none;
    line-height: 2;
    min-height: 120px;
    text-align: center;
    font-size: 18px;
  }
  #scroll .line {
    opacity: 0;
    transition: opacity 1.2s;
  }
  #scroll .line.visible { opacity: 1; }
  #map {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin: 15px 0;
    flex-wrap: wrap;
  }
  .map-point {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(51,51,51,0.8);
    border: 2px solid #666;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    transition: all 0.4s;
  }
  .map-point.done { background: #ffb7c5; border-color: #fff; color: #1a1a2e; }
  .map-point.current { border-color: #ffb7c5; box-shadow: 0 0 10px #ffb7c5; }
  .map-point.secret { border-color: #888; color: #888; font-size: 16px; }
</style>
</head>
<body>

<h1>富士撃</h1>
<div class="subtitle" id="subtitle">七つの巻物</div>

<div id="langBar">
  <button id="langToggle" class="langBtn active">日本語</button>
</div>

<div id="map"></div>

<div id="demon">👹</div>
<div id="demonName"></div>
<div id="seals"></div>

<div id="log"></div>

<button id="hitBtn"></button>
<button id="nextBtn" style="display:none"></button>
<button id="musicBtn"></button>

<div id="scroll"></div>

<script>
const T = {
  jp: {
    subtitle: "七つの巻物",
    hit: "斬る", next: "次へ",
    musicOn: "音楽を鳴らす", musicOff: "音楽を止める",
    mapDays: ["月", "火", "水", "木", "金", "土", "日", "?"],
    win: "を倒した！ 印は巻物に織り込まれた。",
    startLevel: (day, name, el) => `⚔️ <b>${day}: ${name}</b>（${el}）が道を阻む。<br><b>五つの正確な打撃</b>が必要。外せば鬼は二、三の印を取り戻す。`,
    hitOk: (n) => `⚔️ <b>正確な一撃！</b> 壊した印: <b>${n}/5</b>。`,
    miss: (n) => `💨 <b>外した！</b> 鬼は <b>${n} の印</b>を取り戻す。`,
    regen: (a, b) => `🔥 鬼が印を取り戻している… (${a}/${b})`,
    scrollTitle: (i, day, name) => `巻物 ${i}: ${day}、${name}`,
    finalTitle: "最後の巻物",
    finalPoem: "富士は立ち —\n我も立つ。\n桜は咲き —\n我も咲く。\n我は負けぬ。",
    allDone: "✨ <b>七つの巻物が全て集まった！</b><br>しかし…八つ目の巻物が現れた。"
  },
  ru: {
    subtitle: "Семь свитков",
    hit: "Ударить", next: "Дальше",
    musicOn: "Включить музыку", musicOff: "Выключить музыку",
    mapDays: ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс", "?"],
    win: " побеждён! Печати вплетены в свиток.",
    startLevel: (day, name, el) => `⚔️ <b>${day}: ${name}</b> (${el}) преграждает путь.<br>Нужно нанести <b>5 точных ударов</b>. Промах — демон восстановит 2–3 печати.`,
    hitOk: (n) => `⚔️ <b>Точный удар!</b> Сломано печатей: <b>${n}/5</b>.`,
    miss: (n) => `💨 <b>Промах!</b> Демон восстанавливает <b>${n} печати</b>.`,
    regen: (a, b) => `🔥 Демон восстанавливает печать... (${a}/${b})`,
    scrollTitle: (i, day, name) => `Свиток ${i}: ${day}, ${name}`,
    finalTitle: "Последний свиток",
    finalPoem: "Фудзи стоит —\nи я стою.\nСакура цветёт —\nи я цвету.\nМеня не победить.",
    allDone: "✨ <b>Все семь свитков собраны!</b><br>Но появился восьмой свиток…"
  },
  en: {
    subtitle: "Seven Scrolls",
    hit: "Strike", next: "Next",
    musicOn: "Play Music", musicOff: "Stop Music",
    mapDays: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun", "?"],
    win: " defeated! The seals are woven into the scroll.",
    startLevel: (day, name, el) => `⚔️ <b>${day}: ${name}</b> (${el}) blocks the path.<br>You need <b>5 precise strikes</b>. A miss — the demon restores 2–3 seals.`,
    hitOk: (n) => `⚔️ <b>Precise strike!</b> Broken seals: <b>${n}/5</b>.`,
    miss: (n) => `💨 <b>Miss!</b> The demon restores <b>${n} seals</b>.`,
    regen: (a, b) => `🔥 The demon restores a seal... (${a}/${b})`,
    scrollTitle: (i, day, name) => `Scroll ${i}: ${day}, ${name}`,
    finalTitle: "The Last Scroll",
    finalPoem: "Fuji stands —\nand I stand.\nSakura blooms —\nand I bloom.\nI cannot be defeated.",
    allDone: "✨ <b>All seven scrolls are gathered!</b><br>But an eighth scroll has appeared…"
  }
};

const demons = [
  { day: 0, emoji: "👹", el: { jp: "火", ru: "Огонь", en: "Fire" },
    name: { jp: "鬼の鍛冶屋", ru: "Они-кузнец", en: "Oni Blacksmith" },
    poem: { jp: "火花は飛び —\n我心には\n冷たい夜明け。", ru: "Искры летят —\nно в сердце моём\nхолодный рассвет.", en: "Sparks fly —\nyet in my heart\na cold dawn." }},
  { day: 1, emoji: "❄️", el: { jp: "氷", ru: "Лёд", en: "Ice" },
    name: { jp: "雪女", ru: "Юки-онна", en: "Yuki-onna" },
    poem: { jp: "氷は永遠ではない —\n春は来る\n雪の夜にも。", ru: "Лёд не вечен —\nвесна придёт\nдаже в снежную ночь.", en: "Ice is not eternal —\nspring will come\neven in a snowy night." }},
  { day: 2, emoji: "🌪️", el: { jp: "風", ru: "Ветер", en: "Wind" },
    name: { jp: "天狗の風", ru: "Тэнгу-ветер", en: "Tengu Wind" },
    poem: { jp: "風は払う\n余分なものを —\n道だけが残る。", ru: "Ветер сдувает\nвсё лишнее —\nостаётся путь.", en: "The wind sweeps away\neverything extra —\nonly the path remains." }},
  { day: 3, emoji: "💧", el: { jp: "水", ru: "Вода", en: "Water" },
    name: { jp: "河童", ru: "Каппа-река", en: "Kappa of the River" },
    poem: { jp: "川は争わない\n石と —\nそれを回り込む。", ru: "Река не спорит\nс камнем —\nона его обходит.", en: "The river does not argue\nwith the stone —\nit flows around it." }},
  { day: 4, emoji: "🦊", el: { jp: "狐火", ru: "Огонь", en: "Foxfire" },
    name: { jp: "狐火", ru: "Кицунэ-огнь", en: "Kitsune Fire" },
    poem: { jp: "三つの尾は嘘をつく、\nしかし真実は一つ —\n我が刀。", ru: "Три хвоста лгут,\nно правда одна —\nмой меч.", en: "Three tails lie,\nbut the truth is one —\nmy blade." }},
  { day: 5, emoji: "👻", el: { jp: "闇", ru: "Тьма", en: "Darkness" },
    name: { jp: "浪人の亡霊", ru: "Ронин-призрак", en: "Ronin Ghost" },
    poem: { jp: "過去の影は\n我を縛らない —\n我は前へ進む。", ru: "Тень прошлого\nне держит меня —\nя иду вперёд.", en: "The shadow of the past\ndoes not hold me —\nI walk forward." }},
  { day: 6, emoji: "🐉", el: { jp: "地", ru: "Земля", en: "Earth" },
    name: { jp: "富士の龍", ru: "Фудзи-дракон", en: "Fuji Dragon" },
    poem: { jp: "山は立つ —\n我も立つ。\n我らは共に永遠。", ru: "Гора стоит —\nи я стою.\nМы оба — вечны.", en: "The mountain stands —\nand I stand.\nWe are both eternal." }}
];

let lang = "jp";
let level = 0;
let brokenSeals = 0;
let regenTimer = null;
const maxSeals = 5;
const sealsToWin = 5;

const demonEl = document.getElementById('demon');
const demonNameEl = document.getElementById('demonName');
const sealsEl = document.getElementById('seals');
const logEl = document.getElementById('log');
const hitBtn = document.getElementById('hitBtn');
const nextBtn = document.getElementById('nextBtn');
const scrollEl = document.getElementById('scroll');
const mapEl = document.getElementById('map');
const musicBtn = document.getElementById('musicBtn');
const subtitleEl = document.getElementById('subtitle');
const langToggle = document.getElementById('langToggle');

function renderMap() {
  mapEl.innerHTML = '';
  const days = T[lang].mapDays;
  for (let i = 0; i < 8; i++) {
    const p = document.createElement('div');
    p.className = 'map-point';
    if (i < level) p.classList.add('done');
    if (i === level) p.classList.add('current');
    if (i === 7) p.classList.add('secret');
    p.textContent = i < level ? '巻' : days[i];
    mapEl.appendChild(p);
  }
}

function renderSeals() {
  sealsEl.innerHTML = '';
  for (let i = 0; i < maxSeals; i++) {
    const s = document.createElement('div');
    s.className = 'seal';
    if (i < brokenSeals) { s.classList.add('broken'); s.textContent = '✕'; }
    else { s.classList.add('active'); s.textContent = '印'; }
    sealsEl.appendChild(s);
  }
}

function log(t) { logEl.innerHTML = t; }

function updateUI() {
  subtitleEl.textContent = T[lang].subtitle;
  hitBtn.textContent = T[lang].hit;
  nextBtn.textContent = T[lang].next;
  musicBtn.textContent = musicPlaying ? T[lang].musicOff : T[lang].musicOn;
  renderMap();
}

function showScroll(title, poem) {
  scrollEl.style.display = 'block';
  scrollEl.innerHTML = `<b>${title}</b><br><br>`;
  const lines = poem.split('\n');
  lines.forEach((line, i) => {
    const div = document.createElement('div');
    div.className = 'line';
    div.textContent = line;
    scrollEl.appendChild(div);
    setTimeout(() => div.classList.add('visible'), 800 + i * 1200);
  });
}

function startLevel() {
  const d = demons[level];
  const l = T[lang];
  demonEl.textContent = d.emoji;
  demonEl.style.opacity = 1;
  demonNameEl.textContent = d.name[lang];
  brokenSeals = 0;
  if (regenTimer) clearInterval(regenTimer);
  scrollEl.style.display = 'none';
  scrollEl.innerHTML = '';
  nextBtn.style.display = 'none';
  hitBtn.style.display = 'inline-block';
  hitBtn.disabled = false;
  renderSeals();
  renderMap();
  const day = l.mapDays[d.day];
  log(l.startLevel(day, d.name[lang], d.el[lang]));
}

function hit() {
  if (brokenSeals >= sealsToWin) return;
  const l = T[lang];
  const miss = Math.random() < 0.8; // 80% промаха
  if (miss) {
    const regenAmount = Math.random() < 0.5 ? 2 : 3;
    brokenSeals = Math.max(0, brokenSeals - regenAmount);
    log(l.miss(regenAmount));
    startRegen(regenAmount);
  } else {
    brokenSeals++;
    log(l.hitOk(brokenSeals));
    if (regenTimer) { clearInterval(regenTimer); regenTimer = null; }
  }
  renderSeals();
  if (brokenSeals >= sealsToWin) win();
}

function startRegen(amount) {
  if (regenTimer) clearInterval(regenTimer);
  const l = T[lang];
  let restored = 0;
  regenTimer = setInterval(() => {
    if (restored >= amount) { clearInterval(regenTimer); regenTimer = null; return; }
    brokenSeals = Math.max(0, brokenSeals - 1);
    restored++;
    renderSeals();
    log(l.regen(restored, amount));
    if (brokenSeals >= sealsToWin) win();
  }, 1500);
}

function win() {
  if (regenTimer) { clearInterval(regenTimer); regenTimer = null; }
  hitBtn.disabled = true;
  const d = demons[level];
  const l = T[lang];
  demonEl.textContent = '🌸';
  log(`🎉 <b>${d.name[lang]}</b>${l.win}`);
  const day = l.mapDays[d.day];
  showScroll(l.scrollTitle(level + 1, day, d.name[lang]), d.poem[lang]);
  nextBtn.style.display = 'inline-block';
}

function nextLevel() {
  level++;
  if (level >= demons.length) {
    demonEl.textContent = '🏔️';
    demonNameEl.textContent = '';
    hitBtn.style.display = 'none';
    nextBtn.style.display = 'none';
    log(T[lang].allDone);
    showScroll(T[lang].finalTitle, T[lang].finalPoem);
    renderMap();
    return;
  }
  startLevel();
}

let audioCtx = null;
let musicPlaying = false;
let musicTimer = null;
const scale = [0, 2, 5, 7, 9];
const baseFreq = 261.63;

function noteFreq(s) { return baseFreq * Math.pow(2, s / 12); }

function playNote(freq, dur, vol) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.1);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}

function playPhrase() {
  if (!musicPlaying) return;
  const n = 2 + Math.floor(Math.random() * 2);
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      if (!musicPlaying) return;
      const s = scale[Math.floor(Math.random() * scale.length)];
      const oct = Math.random() < 0.3 ? 12 : 0;
      playNote(noteFreq(s + oct), 3, 0.08);
    }, i * 1200);
  }
  musicTimer = setTimeout(playPhrase, n * 1200 + 4000);
}

musicBtn.addEventListener('click', () => {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (musicPlaying) { musicPlaying = false; clearTimeout(musicTimer); }
  else { musicPlaying = true; playPhrase(); }
  updateUI();
});

const langOrder = ["jp", "ru", "en"];
const langLabels = { jp: "日本語", ru: "РУС", en: "ENG" };

langToggle.addEventListener('click', () => {
  const ci = langOrder.indexOf(lang);
  const ni = (ci + 1) % langOrder.length;
  lang = langOrder[ni];
  langToggle.textContent = langLabels[lang];
  updateUI();
  if (level < demons.length) startLevel();
});

hitBtn.addEventListener('click', hit);
nextBtn.addEventListener('click', nextLevel);
updateUI();
startLevel();
</script>

</body>
</html>
